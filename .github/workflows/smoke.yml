name: Coach browser smoke test
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/smoke.yml'
      - 'tests/smoke.mjs'
      - 'index.html'
      - 'course.js'
      - 'knowledge.js'
      - 'sw.js'
      - 'manifest.webmanifest'
      - 'icon.svg'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: coach-browser-smoke
  cancel-in-progress: false
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install browser testing tools
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Start local app server
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 > /tmp/coach-server.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8080/ > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/ > /dev/null
      - name: Test repository and live Pages app
        env:
          LOCAL_URL: http://127.0.0.1:8080/
          LIVE_URL: https://leonardovitolowork-hash.github.io/koii-coach/
        run: node tests/smoke.mjs
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coach-browser-evidence
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7
  report:
    needs: browser
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Download available test evidence
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: coach-browser-evidence
          path: artifacts/
      - name: Prepare actual results report
        env:
          BROWSER_JOB_RESULT: ${{ needs.browser.result }}
        run: |
          mkdir -p .github
          node --input-type=commonjs <<'NODE'
          const fs=require('node:fs');
          const data=fs.existsSync('artifacts/results.json')?JSON.parse(fs.readFileSync('artifacts/results.json','utf8')):{note:'The browser job did not produce a results file. Inspect the job logs; no test pass is claimed.',results:[]};
          const report={recordedAt:new Date().toISOString(),runId:process.env.GITHUB_RUN_ID,sourceCommit:process.env.GITHUB_SHA,browserJobResult:process.env.BROWSER_JOB_RESULT,...data};
          fs.writeFileSync('.github/browser-test-results.json',JSON.stringify(report,null,2)+'\n');
          NODE
      - name: Commit results only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add .github/browser-test-results.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record browser smoke-test results'
          git pull --rebase origin main
          git push origin HEAD:main
