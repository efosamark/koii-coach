name: Restore and publish Coach
on:
  push:
    branches: [main]
    paths: ['.github/workflows/repair.yml', 'hiphop.html']
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: coach-repair-publish
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: https://leonardovitolowork-hash.github.io/koii-coach/
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Recover intact files without rewriting existing lessons
        run: |
          python3 - <<'PY'
          import pathlib, subprocess
          expected={'index.html':'d227404548c54f44c59364d251de4eca6c23f01c','course.js':'b512c1d9a8e3c75f1fec0a456212dc0a7883dd22'}
          for path, sha in expected.items():
              actual=subprocess.check_output(['git','rev-parse','HEAD:'+path],text=True).strip()
              if actual != sha:
                  raise SystemExit('Refusing to overwrite a changed file: '+path)
          subprocess.run(['git','restore','--source=4de807a93df6685bdfe82a8439d93359918bdbc6','--','index.html','course.js'],check=True)
          p=pathlib.Path('index.html'); text=p.read_text()
          assert len(text)>10000 and len(pathlib.Path('course.js').read_text())>10000
          assert text.count('</nav>')==1
          text=text.replace('</nav>','<a class="btn orange" style="white-space:nowrap;text-decoration:none" href="./hiphop.html">07 / Full hip-hop beat</a></nav>')
          p.write_text(text)
          p=pathlib.Path('sw.js'); text=p.read_text().replace("koii-coach-v2","koii-coach-recovery-hiphop-v1").replace("'./course.js',","'./course.js','./hiphop.html',")
          p.write_text(text)
          PY
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install browser test tools
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Test recovered app and new tutorial before publishing
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 > /tmp/coach-server.log 2>&1 &
          sleep 2
          node --input-type=module <<'JS'
          import {chromium} from 'playwright';
          import fs from 'node:fs';
          const browser=await chromium.launch();
          const page=await browser.newPage();
          const errors=[]; page.on('pageerror',e=>errors.push(e.message));
          page.on('response',r=>{if(r.status()>=400 && r.url().startsWith('http://127.0.0.1'))errors.push(r.url());});
          await page.goto('http://127.0.0.1:8080/');
          await page.locator('#step-title').waitFor();
          for(let i=0;i<6;i++){await page.locator('nav button').nth(i).click(); if(!await page.locator('main h1').count())throw Error('Missing view '+i);}
          await page.locator('a[href="./hiphop.html"]').click();
          await page.locator('#tutorial').waitFor();
          if(await page.locator('#tutorial details').count()!==10)throw Error('Missing tutorial sections');
          if(await page.locator('#tutorial li').count()!==50)throw Error('Missing tutorial steps');
          await page.locator('input[type=checkbox]').first().check();
          await page.reload();
          if(!await page.locator('input[type=checkbox]').first().isChecked())throw Error('Progress not retained');
          await page.setViewportSize({width:390,height:844});
          if(await page.evaluate(()=>document.documentElement.scrollWidth>innerWidth+2))throw Error('Mobile overflow');
          if(errors.length)throw Error(errors.join('\n'));
          await browser.close();
          fs.writeFileSync('.github/recovery-results.json',JSON.stringify({testedAt:new Date().toISOString(),repositoryBrowser:'passed',live:'pending',checks:['Six recovered views load','New chapter reachable','10 sections and 50 steps present','Checklist survives reload','390px mobile layout','No browser errors or failed local assets'],limitations:'UI checks do not verify physical hardware operations or musical quality.'},null,2));
          JS
      - name: Commit only recovered app files and actual test report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add index.html course.js sw.js .github/recovery-results.json
          git commit -m 'Restore intact Coach, link full hip-hop chapter, and record passing local UI tests'
          git pull --rebase origin main
          git push origin HEAD:main
      - uses: actions/configure-pages@v5
      - name: Prepare website only
        run: |
          mkdir -p /tmp/coach-site
          cp index.html course.js hiphop.html sw.js manifest.webmanifest icon.svg .nojekyll /tmp/coach-site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/coach-site
      - uses: actions/deploy-pages@v4
      - name: Verify live deployment and record evidence
        run: |
          python3 - <<'PY'
          import json,time,urllib.request,pathlib
          base='https://leonardovitolowork-hash.github.io/koii-coach/'
          for attempt in range(30):
              try:
                  stamp=str(time.time_ns())
                  def read(path):
                      return urllib.request.urlopen(base+path+'?verify='+stamp,timeout=20).read().decode()
                  home=read('index.html'); course=read('course.js'); chapter=read('hiphop.html')
                  assert '07 / Full hip-hop beat' in home and len(home)>10000
                  assert 'const first=[' in course and len(course)>10000
                  assert 'Vinyl to a full hip-hop beat' in chapter and '2 minutes 51 seconds' in chapter
                  break
              except Exception:
                  if attempt==29: raise
                  time.sleep(10)
          p=pathlib.Path('.github/recovery-results.json'); report=json.loads(p.read_text())
          report.update(live='passed HTTP content checks',liveVerifiedAt=time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime()),deploymentRunId=__import__('os').environ['GITHUB_RUN_ID'])
          p.write_text(json.dumps(report,indent=2)+'\n')
          PY
          git add .github/recovery-results.json
          git commit -m 'Record successful live recovery content checks'
          git pull --rebase origin main
          git push origin HEAD:main
