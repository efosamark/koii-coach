name: Install uploaded KOII phone icon
on:
  push:
    branches: [main]
    paths: ['.github/workflows/phone-icon.yml', 'icons/logo-source.webp.b64']
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: coach-repair-publish
  cancel-in-progress: false
jobs:
  icon:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: https://leonardovitolowork-hash.github.io/koii-coach/
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - run: python3 -m pip install Pillow
      - name: Build icon sizes and change only icon configuration
        run: |
          python3 - <<'PY'
          import pathlib,base64,hashlib,io,json,re,subprocess
          from PIL import Image
          expected={'index.html':'41ae90b7a1b684d83dbf6c1e2fa3874471a35bb9','hiphop.html':'62941b5a5c33b5c86ee9603d7fed63360011787c','manifest.webmanifest':'e8d105c892a9a33a71eeff66817c59ab46e33bec','sw.js':'583cc2597d4763e7b5a95daccfb16ce721aefe0f'}
          for name,sha in expected.items():
              if subprocess.check_output(['git','rev-parse','HEAD:'+name],text=True).strip()!=sha:
                  raise SystemExit('Refusing to overwrite changed file: '+name)
          raw=base64.b64decode(pathlib.Path('icons/logo-source.webp.b64').read_text().strip(),validate=True)
          assert hashlib.sha256(raw).hexdigest()=='467d9792c907f7e96562859526c07406e4c0e5ed6df3d75ea5b1742422496112'
          im=Image.open(io.BytesIO(raw)).convert('RGB'); assert im.size==(512,512)
          for size in (180,192,512):
              im.resize((size,size),Image.Resampling.LANCZOS).save('icons/koii-'+str(size)+'-v1.png',optimize=True)
          manifest=pathlib.Path('manifest.webmanifest'); data=json.loads(manifest.read_text())
          data['icons']=[{'src':'icons/koii-192-v1.png','sizes':'192x192','type':'image/png','purpose':'any'},{'src':'icons/koii-512-v1.png','sizes':'512x512','type':'image/png','purpose':'any'},{'src':'icons/koii-512-v1.png','sizes':'512x512','type':'image/png','purpose':'maskable'}]
          manifest.write_text(json.dumps(data,indent=2)+'\n')
          links='<link rel="icon" type="image/png" href="./icons/koii-192-v1.png"><link rel="apple-touch-icon" sizes="180x180" href="./icons/koii-180-v1.png">'
          for name in ('index.html','hiphop.html'):
              p=pathlib.Path(name); text=p.read_text()
              text,n=re.subn(r'<link rel="icon"[^>]*>',links,text,count=1); assert n==1
              p.write_text(text)
          p=pathlib.Path('sw.js'); text=p.read_text().replace('koii-coach-recovery-hiphop-v1','koii-coach-phone-icon-v1')
          text=text.replace("'./icon.svg'","'./icon.svg','./icons/koii-180-v1.png','./icons/koii-192-v1.png','./icons/koii-512-v1.png'")
          p.write_text(text)
          for entry in data['icons']:
              with Image.open(entry['src']) as icon: assert str(icon.width)+'x'+str(icon.height)==entry['sizes']
          report={'checkedAt':__import__('time').strftime('%Y-%m-%dT%H:%M:%SZ',__import__('time').gmtime()),'local':'passed image dimensions, source hash, manifest and HTML icon-link checks','live':'pending','source':'Uploaded generated-image.jpg, resized and compressed for icon delivery; artwork unchanged.','limitations':'Actual home-screen appearance and existing-install icon refresh are not tested.'}
          pathlib.Path('.github/phone-icon-results.json').write_text(json.dumps(report,indent=2)+'\n')
          PY
      - name: Commit the icons and icon-only changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add icons/koii-180-v1.png icons/koii-192-v1.png icons/koii-512-v1.png manifest.webmanifest index.html hiphop.html sw.js .github/phone-icon-results.json
          git commit -m 'Use uploaded KOII design for Android and iPhone home-screen icons'
          git pull --rebase origin main
          git push origin HEAD:main
      - uses: actions/configure-pages@v5
      - name: Prepare website with icon assets
        run: |
          mkdir -p /tmp/coach-site/icons
          cp index.html course.js hiphop.html sw.js manifest.webmanifest icon.svg .nojekyll /tmp/coach-site/
          cp icons/koii-*-v1.png /tmp/coach-site/icons/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/coach-site
      - uses: actions/deploy-pages@v4
      - name: Check published icon files and configuration
        run: |
          python3 - <<'PY'
          import urllib.request,time,json,io,pathlib
          from PIL import Image
          base='https://leonardovitolowork-hash.github.io/koii-coach/'
          for attempt in range(30):
              try:
                  stamp=str(time.time_ns())
                  def read(name): return urllib.request.urlopen(base+name+'?verify='+stamp,timeout=20).read()
                  manifest=json.loads(read('manifest.webmanifest'))
                  assert manifest['icons'][0]['src']=='icons/koii-192-v1.png'
                  for size in (180,192,512):
                      with Image.open(io.BytesIO(read('icons/koii-'+str(size)+'-v1.png'))) as im: assert im.size==(size,size)
                  assert 'apple-touch-icon' in read('index.html').decode()
                  assert 'apple-touch-icon' in read('hiphop.html').decode()
                  break
              except Exception:
                  if attempt==29: raise
                  time.sleep(10)
          p=pathlib.Path('.github/phone-icon-results.json'); data=json.loads(p.read_text())
          data.update(live='passed HTTP icon, size and configuration checks',liveVerifiedAt=time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime()))
          p.write_text(json.dumps(data,indent=2)+'\n')
          PY
          git add .github/phone-icon-results.json
          git commit -m 'Record live KOII phone-icon verification'
          git pull --rebase origin main
          git push origin HEAD:main
