name: Publish Tech House Coach chapter
on:
  push:
    branches: [main]
    paths: ['.github/workflows/tech-house.yml', 'tech-house.html']
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: coach-repair-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: https://leonardovitolowork-hash.github.io/koii-coach/
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Link the new chapter without rewriting current lessons
        run: |
          python3 - <<'PY'
          import pathlib,subprocess
          expected={'index.html':'41ae90b7a1b684d83dbf6c1e2fa3874471a35bb9','hiphop.html':'62941b5a5c33b5c86ee9603d7fed63360011787c','sw.js':'583cc2597d4763e7b5a95daccfb16ce721aefe0f'}
          for path,sha in expected.items():
              if subprocess.check_output(['git','rev-parse','HEAD:'+path],text=True).strip()!=sha: raise SystemExit('Refusing to overwrite changed file: '+path)
          p=pathlib.Path('index.html'); text=p.read_text(); assert text.count('</nav>')==1
          p.write_text(text.replace('</nav>','<a class="btn light" style="white-space:nowrap;text-decoration:none" href="./tech-house.html">08 / Tech House</a></nav>'))
          p=pathlib.Path('sw.js'); text=p.read_text().replace('koii-coach-recovery-hiphop-v1','koii-coach-tech-house-v1').replace("'./hiphop.html',","'./hiphop.html','./tech-house.html',")
          p.write_text(text)
          PY
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install browser test tools
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Test all existing views and the Tech House chapter
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 > /tmp/tech-house-server.log 2>&1 &
          sleep 2
          node --input-type=module <<'JS'
          import {chromium} from 'playwright';
          import fs from 'node:fs';
          const b=await chromium.launch(),p=await b.newPage(),errors=[];
          p.on('pageerror',e=>errors.push(e.message));
          p.on('response',r=>{if(r.status()>=400&&r.url().startsWith('http://127.0.0.1'))errors.push(r.url());});
          await p.goto('http://127.0.0.1:8080/'); await p.locator('#step-title').waitFor();
          for(let i=0;i<6;i++){await p.locator('nav button').nth(i).click(); if(!await p.locator('main h1').count())throw Error('Existing view '+i+' failed');}
          await p.locator('a[href="./tech-house.html"]').click(); await p.locator('#tech-house').waitFor();
          if(await p.locator('#tech-house details').count()!==12)throw Error('Expected 12 Tech House sections');
          if(await p.locator('#tech-house li').count()!==48)throw Error('Expected 48 Tech House steps');
          const chapter=await p.locator('#tech-house').innerText();
          for(const need of ['display shows 16','1.1.1','4.4.2','DROP A','Song list'])if(!chapter.includes(need))throw Error('Missing guidance: '+need);
          await p.locator('input[type=checkbox]').first().check(); await p.reload();
          if(!await p.locator('input[type=checkbox]').first().isChecked())throw Error('Checklist did not persist');
          await p.setViewportSize({width:390,height:844}); if(await p.evaluate(()=>document.documentElement.scrollWidth>innerWidth+2))throw Error('Mobile overflow');
          if(errors.length)throw Error(errors.join('\n')); await b.close();
          fs.writeFileSync('.github/tech-house-results.json',JSON.stringify({testedAt:new Date().toISOString(),repositoryBrowser:'passed',live:'pending',checks:['Six existing views load','New chapter link works','12 sections and 48 explicit steps','Required event positions present','Checklist persists','390px mobile layout','No local browser errors or failed assets'],limitations:'UI checks do not verify physical K.O. II operations, installed OS version, samples, speaker system or musical quality.'},null,2));
          JS
      - name: Commit tested site changes only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js .github/tech-house-results.json
          git commit -m 'Link Tech House Coach chapter and record passing local UI tests'
          git pull --rebase origin main
          git push origin HEAD:main
      - uses: actions/configure-pages@v5
      - name: Assemble published site
        run: |
          mkdir -p /tmp/coach-site
          cp index.html course.js hiphop.html tech-house.html sw.js manifest.webmanifest icon.svg .nojekyll /tmp/coach-site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/coach-site
      - uses: actions/deploy-pages@v4
      - name: Verify published chapter content
        run: |
          python3 - <<'PY'
          import urllib.request,time,json,pathlib,os
          base='https://leonardovitolowork-hash.github.io/koii-coach/'
          for attempt in range(30):
              try:
                  stamp=str(time.time_ns())
                  def read(name): return urllib.request.urlopen(base+name+'?verify='+stamp,timeout=20).read().decode()
                  home=read('index.html'); chapter=read('tech-house.html')
                  assert '08 / Tech House' in home and 'Tech House / party-ready track' in chapter
                  assert chapter.count('<li>')==48 and 'display shows 16' in chapter and '112 bars' in chapter
                  break
              except Exception:
                  if attempt==29: raise
                  time.sleep(10)
          p=pathlib.Path('.github/tech-house-results.json'); report=json.loads(p.read_text())
          report.update(live='passed HTTP content checks',liveVerifiedAt=time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime()),deploymentRunId=os.environ['GITHUB_RUN_ID'])
          p.write_text(json.dumps(report,indent=2)+'\n')
          PY
          git add .github/tech-house-results.json
          git commit -m 'Record published Tech House chapter verification'
          git pull --rebase origin main
          git push origin HEAD:main
